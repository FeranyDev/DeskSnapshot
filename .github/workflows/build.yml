name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT_PATH: src/DeskSnapshot/DeskSnapshot.csproj
  RUNTIME_IDENTIFIER: win-x64

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WinUI app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore $env:PROJECT_PATH --runtime $env:RUNTIME_IDENTIFIER --configfile NuGet.Config
      - name: Build Release
        run: dotnet build $env:PROJECT_PATH --configuration Release --runtime $env:RUNTIME_IDENTIFIER --no-restore
      - name: Run unit tests
        run: dotnet test tests/DeskSnapshot.Tests/DeskSnapshot.Tests.csproj --configuration Release

  package:
    name: Publish portable and MSIX packages
    runs-on: windows-latest
    needs: build
    if: github.event_name != 'pull_request'
    environment: signing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore reusable signing certificate
        id: signing-certificate
        shell: pwsh
        env:
          DESKSNAPSHOT_SIGNING_CERTIFICATE_BASE64: ${{ secrets.DESKSNAPSHOT_SIGNING_CERTIFICATE_BASE64 }}
          DESKSNAPSHOT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.DESKSNAPSHOT_SIGNING_CERTIFICATE_PASSWORD }}
          DESKSNAPSHOT_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.DESKSNAPSHOT_SIGNING_CERTIFICATE_THUMBPRINT }}
        run: ./scripts/restore-signing-certificate.ps1 -OutputPath (Join-Path $env:RUNNER_TEMP "DeskSnapshot-Signing.pfx")
      - name: Publish packages
        shell: pwsh
        run: |
          ./scripts/publish.ps1 `
            -Mode All `
            -RuntimeIdentifier win-x64 `
            -Version "1.0.${{ github.run_number }}" `
            -CertificateThumbprint "${{ steps.signing-certificate.outputs.thumbprint }}" `
            -Clean `
            -NoZip
      - name: Verify build signatures
        timeout-minutes: 5
        shell: pwsh
        run: >
          ./scripts/verify-signatures.ps1
          -PortableFolder "artifacts/release/DeskSnapshot-1.0.${{ github.run_number }}-win-x64/folder"
          -MsixFolder "artifacts/release/DeskSnapshot-1.0.${{ github.run_number }}-win-x64/msix"
          -TrustCertificatePath "artifacts/release/DeskSnapshot-1.0.${{ github.run_number }}-win-x64/DeskSnapshot-Signing.cer"
      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: DeskSnapshot-1.0.${{ github.run_number }}-win-x64-portable
          path: artifacts/release/DeskSnapshot-1.0.${{ github.run_number }}-win-x64/folder/
          if-no-files-found: error
      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: DeskSnapshot-1.0.${{ github.run_number }}-win-x64-msix
          path: artifacts/release/DeskSnapshot-1.0.${{ github.run_number }}-win-x64/msix/
          if-no-files-found: error
      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.signing-certificate.outputs.thumbprint }}") {
            ./scripts/remove-signing-certificate.ps1 -Thumbprint "${{ steps.signing-certificate.outputs.thumbprint }}"
          }
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "DeskSnapshot-Signing.pfx") -Force -ErrorAction SilentlyContinue
