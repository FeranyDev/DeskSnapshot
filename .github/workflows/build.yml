name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT_PATH: src/DeskSnapshot/DeskSnapshot.csproj
  RUNTIME_IDENTIFIER: win-x64

jobs:
  build:
    name: Build WinUI app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore $env:PROJECT_PATH --runtime $env:RUNTIME_IDENTIFIER --configfile NuGet.Config
      - name: Build Release
        run: dotnet build $env:PROJECT_PATH --configuration Release --runtime $env:RUNTIME_IDENTIFIER --no-restore

  package:
    name: Publish portable and MSIX packages
    runs-on: windows-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish packages
        shell: pwsh
        run: >
          ./scripts/publish.ps1
          -Mode All
          -RuntimeIdentifier win-x64
          -Version "1.0.${{ github.run_number }}"
          -Clean
          -NoZip
          -CreateTestCertificate
      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: DeskSnapshot-1.0.${{ github.run_number }}-win-x64-portable
          path: artifacts/release/DeskSnapshot-1.0.${{ github.run_number }}-win-x64/folder/
          if-no-files-found: error
      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: DeskSnapshot-1.0.${{ github.run_number }}-win-x64-msix
          path: artifacts/release/DeskSnapshot-1.0.${{ github.run_number }}-win-x64/msix/
          if-no-files-found: error
