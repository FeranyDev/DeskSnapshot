name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT_PATH: src/DeskSnapshot/DeskSnapshot.csproj
  RUNTIME_IDENTIFIER: win-x64

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WinUI app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore $env:PROJECT_PATH --runtime $env:RUNTIME_IDENTIFIER --configfile NuGet.Config
      - name: Build Release
        run: dotnet build $env:PROJECT_PATH --configuration Release --runtime $env:RUNTIME_IDENTIFIER --no-restore
      - name: Run unit tests
        run: dotnet test tests/DeskSnapshot.Tests/DeskSnapshot.Tests.csproj --configuration Release

  package:
    name: Publish portable and MSIX packages
    runs-on: windows-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Create temporary build signing certificate
        id: build-certificate
        shell: pwsh
        run: ./scripts/new-temporary-signing-certificate.ps1 -OutputDirectory $env:RUNNER_TEMP
      - name: Publish packages
        shell: pwsh
        run: |
          $certificatePassword = Get-Content -LiteralPath "${{ steps.build-certificate.outputs.password_path }}" -Raw
          try {
            ./scripts/publish.ps1 `
              -Mode All `
              -RuntimeIdentifier win-x64 `
              -Version "1.0.${{ github.run_number }}" `
              -CertificatePath "${{ steps.build-certificate.outputs.pfx_path }}" `
              -CertificatePassword $certificatePassword `
              -Clean `
              -NoZip
          } finally {
            $certificatePassword = $null
          }
      - name: Verify build signatures
        timeout-minutes: 5
        shell: pwsh
        run: >
          ./scripts/verify-signatures.ps1
          -PortableFolder "artifacts/release/DeskSnapshot-1.0.${{ github.run_number }}-win-x64/folder"
          -MsixFolder "artifacts/release/DeskSnapshot-1.0.${{ github.run_number }}-win-x64/msix"
          -TrustCertificatePath "artifacts/release/DeskSnapshot-1.0.${{ github.run_number }}-win-x64/DeskSnapshot-Signing.cer"
      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: DeskSnapshot-1.0.${{ github.run_number }}-win-x64-portable
          path: artifacts/release/DeskSnapshot-1.0.${{ github.run_number }}-win-x64/folder/
          if-no-files-found: error
      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: DeskSnapshot-1.0.${{ github.run_number }}-win-x64-msix
          path: artifacts/release/DeskSnapshot-1.0.${{ github.run_number }}-win-x64/msix/
          if-no-files-found: error
      - name: Remove temporary build signing certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "DeskSnapshot-Build-Signing.pfx") -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "DeskSnapshot-Build-Signing.password") -Force -ErrorAction SilentlyContinue
