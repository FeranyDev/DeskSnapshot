name: Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0
        required: true
        default: 1.0.0
      mode:
        description: Package mode
        required: true
        default: All
        type: choice
        options: [All, Folder, Msix]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package DeskSnapshot
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish package
        shell: pwsh
        run: >
          ./scripts/publish.ps1
          -Mode "${{ inputs.mode }}"
          -RuntimeIdentifier win-x64
          -Version "${{ inputs.version }}"
          -Clean
          -NoZip
          -CreateTestCertificate
      - name: Upload portable artifact
        if: ${{ inputs.mode == 'Folder' || inputs.mode == 'All' }}
        uses: actions/upload-artifact@v7
        with:
          name: DeskSnapshot-${{ inputs.version }}-win-x64-portable
          path: artifacts/release/DeskSnapshot-${{ inputs.version }}-win-x64/folder/
          if-no-files-found: error
      - name: Upload MSIX artifact
        if: ${{ inputs.mode == 'Msix' || inputs.mode == 'All' }}
        uses: actions/upload-artifact@v7
        with:
          name: DeskSnapshot-${{ inputs.version }}-win-x64-msix
          path: artifacts/release/DeskSnapshot-${{ inputs.version }}-win-x64/msix/
          if-no-files-found: error
