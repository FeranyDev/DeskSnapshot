name: Bug report
description: Report a reproducible problem in DeskSnapshot
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve DeskSnapshot. Remove personal desktop data from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: DeskSnapshot version
      placeholder: 1.0.0, commit hash, or GitHub Actions build number
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Installation type
      options: [Portable, MSIX, Visual Studio or dotnet run]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows and display configuration
      placeholder: Windows 11 24H2, two 4K monitors, 150% scaling
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove usernames, local paths, and private desktop icon names first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed private information from attachments.
          required: true
        - label: I did not attach a PFX, private key, certificate password, or Base64 signing secret.
          required: true
